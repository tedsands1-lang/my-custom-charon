name: Compile Custom Font
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint
          npm install -g @be5invis/iosevka-tools

      - name: Create Custom Build Configuration
        run: |
          cat << 'EOF' > private-build-plans.toml
          [buildPlans.iosevka-charon-custom]
          family = "Iosevka Charon Custom"
          spacing = "normal"
          serifs = "sans"
          noCvSs = true
          exportGlyphNames = false

          [buildPlans.iosevka-charon-custom.variants.design]
          two = "straight-neck-serifless"
          four = "semi-open-serifless"
          five = "upright-arched-serifless"
          six = "open-contour"
          seven = "bend-serifless"
          nine = "open-contour"
          zero = "unslashed"
          capital-z = "straight-serifless"
          g = "double-storey"
          brace = "straight"
          guillemet = "curly"
          EOF

      - name: Compile Custom Font
        run: |
          npx iosevka-tools build ttf::iosevka-charon-custom

      - name: Upload Font Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-charon-custom-font
          path: dist/
